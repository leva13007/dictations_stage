name: Release to prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to confirm'
        required: true
        type: string

jobs:
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.check_tests.outputs.passed }}
      last_run_url: ${{ steps.check_tests.outputs.run_url }}

    steps:
      - name: Validate confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "release" ]; then
            echo "❌ Confirmation failed. Type exactly 'release' to proceed."
            exit 1
          fi

      - name: Check last test run in tests repo
        id: check_tests
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          echo "Fetching last workflow run from tests repo..."

          RESPONSE=$(gh api \
            repos/leva13007/dictations_testing_playwright/actions/workflows/run-tests.yml/runs \
            --jq '.workflow_runs[0] | {conclusion: .conclusion, status: .status, url: .html_url, created_at: .created_at}')

          echo "Last run: $RESPONSE"

          CONCLUSION=$(echo $RESPONSE | jq -r '.conclusion')
          STATUS=$(echo $RESPONSE | jq -r '.status')
          RUN_URL=$(echo $RESPONSE | jq -r '.url')
          CREATED_AT=$(echo $RESPONSE | jq -r '.created_at')

          echo "run_url=$RUN_URL" >> $GITHUB_OUTPUT

          if [ "$STATUS" != "completed" ]; then
            echo "⚠️ Last test run is still in progress (status: $STATUS)"
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "❌ Last test run did not pass (conclusion: $CONCLUSION)"
            echo "❌ Run URL: $RUN_URL"
            echo "❌ Run date: $CREATED_AT"
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ Last test run passed!"
          echo "✅ Run URL: $RUN_URL"
          echo "✅ Run date: $CREATED_AT"
          echo "passed=true" >> $GITHUB_OUTPUT

  release:
    name: Copy stage → prod
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout stage (this repo)
        uses: actions/checkout@v4
        with:
          path: stage

      - name: Checkout prod repo
        uses: actions/checkout@v4
        with:
          repository: leva13007/dictations
          token: ${{ secrets.RELEASE_TOKEN }}
          path: prod

      - name: Sync dics/ from stage to prod
        run: |
          echo "Syncing dics/ folder..."
          rsync -av --delete stage/dics/ prod/dics/
          echo "Sync complete."

      - name: Commit and push to prod
        run: |
          cd prod
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          # Exit cleanly if nothing changed
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to release. Prod is already up to date."
            exit 0
          fi

          STAGE_SHA=$(cd ../stage && git rev-parse --short HEAD)
          git commit -m "release: sync from dictations_stage @ $STAGE_SHA"
          git push
          echo "✅ Prod updated successfully!"

  smoke-test:
    name: Smoke test prod
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Trigger smoke tests against prod
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          echo "Triggering smoke tests against prod..."

          echo '{
            "event_type": "run-tests",
            "client_payload": {
              "api_url": "https://leva13007.github.io/dictations_prod/dics/",
              "environment": "prod"
            }
          }' | gh api repos/leva13007/dictations_testing_playwright/dispatches \
            --method POST \
            --input -

          echo "✅ Smoke test triggered!"
          echo "Check progress at: https://github.com/leva13007/dictations_testing_playwright/actions"
